name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the CI job only reads the repository.
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. force-pushes to a PR).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff check
        run: ruff check taskmaestro/ tests/ examples/

      - name: Ruff format check
        run: ruff format --check taskmaestro/ tests/ examples/

      - name: Mypy type check
        run: mypy taskmaestro

      - name: Run tests with coverage
        run: pytest --cov=taskmaestro --cov-report=term-missing --cov-fail-under=100

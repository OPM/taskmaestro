[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskmaestro"
version = "0.1.0"
description = "A Python 3.12+ library for defining and executing typed DAG task workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Ceetron Solutions", email = "info@ceetronsolutions.com" }]
keywords = ["workflow", "dag", "pipeline", "pydantic", "task", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/OPM/taskmaestro"
Repository = "https://github.com/OPM/taskmaestro"
Issues = "https://github.com/OPM/taskmaestro/issues"

[tool.hatch.build.targets.sdist]
exclude = [
    "CLAUDE.md",
]

[tool.hatch.build.targets.wheel]
packages = ["taskmaestro"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 99
extend-exclude = ["docker-utils"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E741", "UP046"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
